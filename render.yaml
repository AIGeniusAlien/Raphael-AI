services:
  - type: web
    name: raphael-ai
    env: python
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash run_staging.sh"
    autoDeploy: false
    healthCheckPath: /readyz
    envVars:
      - key: RAPHAEL_DEV_PORTAL
        value: "1"
      - key: RAPHAEL_DEV_SYNTHETIC_ONLY
        value: "1"
      - key: RAPHAEL_BIND_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
